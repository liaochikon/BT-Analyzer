[pytest]
# Node tests live NEXT TO each node (nodes/<node>/test_node.py) plus the engine suite in tests/.
# Two settings make that layout work:
#   - importlib mode: the 24 files all named "test_node.py" would collide under the default
#     prepend mode (nodes/ is not a package); importlib derives a unique module name per path.
#   - testpaths: collect both trees. The shared fixtures live in the repo-root conftest.py so they
#     reach nodes/*/test_node.py as well as tests/.
addopts = --import-mode=importlib --strict-markers
testpaths = tests nodes
python_files = test_*.py
markers =
	unit: isolated core, DSP, contract, or node behavior
	integration: multiple application, worker, persistence, or GUI projection boundaries
	runtime: semantic user scenarios through the production bus, owner, pipeline, and projection
	node: co-located node plugin behavior under nodes/
	architecture: static dependency and ownership boundary gates
